<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC EVO Fuel Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0c0e;--panel:#15171a;--line:#2a2d32;--txt:#eceef0;--mut:#8b9097;--acc:#ff0000;--acc2:#ff0000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Barlow',system-ui,sans-serif}
body{background:radial-gradient(900px 400px at 85% -10%,#2a0808 0%,transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--acc);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap}
h1{font:700 30px/1 'Barlow Condensed',Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0}
h1 span{color:var(--acc)}
header small{color:var(--mut);font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.15em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));border-left:3px solid var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font:600 13px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
select,input[type=text],input[type=number]{width:100%;background:#0e0f11;color:var(--txt);border:1px solid var(--line);padding:10px 12px;font:600 18px 'Barlow Condensed',sans-serif;letter-spacing:.04em;border-radius:0;outline:none}
select:focus,input:focus{border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.big-time{font:700 34px 'Barlow Condensed',sans-serif;color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.tog{display:grid;grid-template-columns:1fr 1fr}
.tog button{background:#0e0f11;color:var(--mut);border:1px solid var(--line);padding:10px;font:700 18px 'Barlow Condensed',sans-serif;letter-spacing:.12em;cursor:pointer}
.tog button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;margin:0;color:var(--txt);font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
.rm,.add{background:#0e0f11;color:var(--txt);border:1px solid var(--line);font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;cursor:pointer}
.rm{margin:0 10px 0 auto}
.rm:hover:not(:disabled),.add:hover{border-color:var(--acc);color:var(--acc)}
.rm:disabled{opacity:.35;cursor:not-allowed}
.add{margin-top:10px;padding:8px 14px}
.stepper{display:flex}
.stepper input{flex:1;min-width:0}
.stepper button{width:44px;background:#0e0f11;color:var(--txt);border:1px solid var(--line);font:700 22px 'Barlow Condensed',sans-serif;cursor:pointer;touch-action:manipulation;user-select:none}
.stepper button:first-child{border-right:0}
.stepper button:last-child{border-left:0}
.stepper button:active{background:var(--acc);border-color:var(--acc)}
.result{text-align:center;background:linear-gradient(180deg,#1d0a0a,var(--panel))}
.result .lbl{font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.result .fuel{font:700 clamp(72px,18vw,120px)/1 'Barlow Condensed',sans-serif;color:#fff}
.result .fuel small{font-size:.35em;color:var(--acc);margin-left:6px;letter-spacing:.06em}
.result .sub{font:600 26px 'Barlow Condensed',sans-serif;letter-spacing:.08em;margin-top:4px}
.result .sub b{color:var(--acc)}
.plan{display:none}
.plan.show{display:block}
.plan h2{margin:0 0 6px;font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.pit{padding:8px 0;border-bottom:1px solid var(--line)}
.pit:last-of-type{border:0}
.pit .row span:first-child{font:600 18px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase}
.pit .row span:last-child{font:700 26px 'Barlow Condensed',sans-serif;color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
<header><h1>AC <span>EVO</span> Fuel</h1><small>calculator</small></header>

<div class="card grid">
 <div><label for="car">Car</label><select id="car"></select></div>
 <div><label for="track">Circuit</label><select id="track"></select></div>
 <div><label for="lap">Lap time (m:ss.d)</label><div class="stepper"><button type="button" data-d="-0.1" aria-label="Lap time -0.1 s">−</button><input id="lap" type="text" value="2:20.0" inputmode="decimal"><button type="button" data-d="0.1" aria-label="Lap time +0.1 s">+</button></div></div>
 <div><label for="cons">Fuel per lap (liters)</label><input id="cons" type="number" step="0.1" min="0.1"><div class="hint" id="chint"></div></div>
</div>

<div class="card">
 <div class="row"><label for="dur" style="margin:0">Race duration</label><span class="big-time"><span id="durv">60</span> min</span></div>
 <input id="dur" type="range" min="0" max="180" step="1" value="60">
</div>

<div class="card grid">
 <div><label>Conditions</label><div class="tog"><button id="dry" class="on">DRY</button><button id="wet">WET</button></div><div class="hint">WET = 8% less fuel per lap</div></div>
 <div><label for="res">Reserve fuel (liters)</label><input id="res" type="number" step="1" min="0" value="3"></div>
 <div><label class="chk"><input type="checkbox" id="pit"> Pit stop(s)</label></div>
 <div><label for="startcap">Max. start fuel (liters)</label><input id="startcap" type="number" step="1" min="30" value="80"></div>
</div>

<div class="card result">
 <div class="lbl">Total fuel needed</div>
 <div class="fuel"><span id="total">0</span><small>L</small></div>
 <div class="sub">Total laps: <b id="laps">0</b></div>
 <div class="sub">Total race time: <b id="rtime">0:00</b></div>
</div>

<div class="card plan" id="plan"><h2>Fuel plan</h2><div id="segs"></div><div class="hint">Drag a slider: the other sliders adjust so the total stays the same.</div></div>
</div>

<script>
// Estimates: L/100km per car x track length x track factor. All values are editable.
var BASE=50;
var CARS=[["Audi R8 LMS GT3 Evo II",1.00],["BMW M4 GT3 EVO",0.98],["Ferrari 296 GT3",0.97],["Ford Mustang GT3",1.04],["Lamborghini Huracán GT3 Evo2",1.05],["McLaren 720S GT3 Evo",0.99],["Mercedes-AMG GT3 Evo",1.06],["Porsche 911 GT3 R (992)",1.01]];
var TRACKS=[["Spa-Francorchamps",7.004,1.00],["Monza",5.793,1.02],["Imola",4.909,0.95],["Mugello",5.245,0.97],["Nürburgring GP",5.148,0.95],["Red Bull Ring",4.318,1.00],["Brands Hatch GP",3.916,0.93],["Laguna Seca",3.602,0.90],["Suzuka",5.807,0.97],["Road America",6.515,1.02],["Barcelona-Catalunya",4.675,0.96]];
var $=function(i){return document.getElementById(i)};
var car=$('car'),track=$('track'),cons=$('cons'),wet=false;
var pit={key:'',vals:[],lo:[],hi:[]};
CARS.forEach(function(c,i){car.add(new Option(c[0],i))});
TRACKS.forEach(function(t,i){track.add(new Option(t[0],i))});
car.value=1;
function est(){var c=CARS[car.value],t=TRACKS[track.value];return Math.round(t[1]*BASE/100*c[1]*t[2]*10)/10}
function setEst(){cons.value=est();calc()}
function parseLap(s){s=s.trim().replace(',','.');var m=s.match(/^(\d+):(\d{1,2}(?:\.\d+)?)$/);if(m)return +m[1]*60+ +m[2];var n=parseFloat(s);return n>0?n:NaN}
function f(n){return n.toLocaleString('en-US',{maximumFractionDigits:1})}
function fmt(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x}
function label(i){return i===0?'Start':'Pit stop '+i}
function paint(){pit.vals.forEach(function(v,i){$('s'+i).value=v;$('v'+i).textContent=v+' L'})}
function slide(i,v){
 v=+v;var vals=pit.vals,d=v-vals[i],rem=Math.abs(d),n=vals.length;
 if(!d)return;
 for(var k=1;k<n&&rem>0;k++){var j=(i+k)%n,room=d>0?vals[j]-pit.lo[j]:pit.hi[j]-vals[j],mv=Math.min(rem,room);vals[j]+=d>0?-mv:mv;rem-=mv}
 vals[i]=d>0?v-rem:v+rem;paint();
}
function buildPlan(total,cap){
 var n=1,start,stops=[];
 if(total<60){start=Math.ceil(total/2);stops=[total-start]}
 else{while(total-30*n>cap)n++;start=total-30*n;for(var i=0;i<n;i++)stops.push(30)}
 pit.vals=[start].concat(stops);pit.cap=cap;pit.total=total;
 render();
}
function render(){
 var v=pit.vals,n=v.length,h='',canRm=pit.cap+80*(n-2)>=pit.total;
 pit.lo=v.map(function(_,i){return i?0:1});
 pit.hi=v.map(function(_,i){return i?80:pit.cap});
 v.forEach(function(_,i){h+='<div class="pit"><div class="row"><span>'+label(i)+'</span>'+(i>0&&n>2?'<button type="button" class="rm" onclick="rmStop('+i+')"'+(canRm?'':' disabled title="Not enough capacity left without this stop"')+'>Remove</button>':'')+'<span id="v'+i+'"></span></div><input type="range" id="s'+i+'" min="'+pit.lo[i]+'" max="'+pit.hi[i]+'" step="1" oninput="slide('+i+',this.value)"></div>'});
 if(n<6)h+='<button type="button" class="add" onclick="addStop()">+ Add pit stop</button>';
 $('segs').innerHTML=h;paint();
}
function rmStop(i){
 var v=pit.vals,free=v[i],moved=true;v.splice(i,1);
 function fill(m){moved=true;while(free>0&&moved){moved=false;for(var j=1;j<v.length&&free>0;j++)if(v[j]<m){v[j]++;free--;moved=true}}}
 fill(30);
 var a=Math.min(free,pit.cap-v[0]);v[0]+=a;free-=a;
 fill(80);
 render();
}
function addStop(){
 var v=pit.vals,t=Math.max(0,Math.min(30,v[0]-1));
 v[0]-=t;v.push(t);render();
}
function calc(){
 var lap=parseLap($('lap').value),min=+$('dur').value,pc=parseFloat(cons.value),res=Math.max(0,Math.ceil(parseFloat($('res').value)||0));
 $('durv').textContent=min;
 $('chint').textContent='Estimate: '+f(est())+' L/lap (editable)';
 if(!(lap>0)||!(pc>0)||min===0){$('total').textContent='0';$('laps').textContent='0';$('rtime').textContent='0:00';$('plan').classList.remove('show');return}
 var laps=Math.floor(min*60/lap)+1; // the lap in progress when time runs out is still completed
 var total=Math.ceil(laps*pc*(wet?0.92:1)+res);
 $('total').textContent=total;$('laps').textContent=laps;$('rtime').textContent=fmt(laps*lap);
 var plan=$('plan');
 if(!$('pit').checked){plan.classList.remove('show');pit.key='';return}
 var cap=Math.max(30,parseFloat($('startcap').value)||80),key=total+'|'+cap;
 if(key!==pit.key){pit.key=key;buildPlan(total,cap)}
 plan.classList.add('show');
}
function fmtLap(s){var m=Math.floor(s/60),x=(s-m*60).toFixed(1);return m+':'+(x<10?'0':'')+x}
function stepLap(d){var s=parseLap($('lap').value);if(!(s>0))s=140;s=Math.max(1,Math.round((s+d)*10)/10);$('lap').value=fmtLap(s);calc()}
document.querySelectorAll('.stepper button').forEach(function(b){var t,iv;function stop(){clearTimeout(t);clearInterval(iv)}
 b.addEventListener('pointerdown',function(e){e.preventDefault();var d=+b.dataset.d;stepLap(d);t=setTimeout(function(){iv=setInterval(function(){stepLap(d)},70)},400)});
 ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,stop)})});
car.onchange=track.onchange=setEst;
['lap','dur','res','startcap','pit'].forEach(function(i){$(i).oninput=calc});
cons.oninput=calc;
$('dry').onclick=function(){wet=false;$('dry').className='on';$('wet').className='';calc()};
$('wet').onclick=function(){wet=true;$('wet').className='on';$('dry').className='';calc()};
setEst();
</script>
</body>
</html>
